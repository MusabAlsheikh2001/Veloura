name: Veloura V2 Build

on:
  push:
    branches:
      - feat/impeccable-veloura-studio-v2
  pull_request:
    branches:
      - review/all-work
      - main

jobs:
  build:
    name: Angular SSR Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
