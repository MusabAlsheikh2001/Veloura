<header class="vs-header" [class.is-open]="menuOpen()">
  <div class="vs-header__inner">
    <div class="vs-header__identity"><a [routerLink]="t.path('/')" [attr.aria-label]="text('Veloura home','الرئيسية - فيلورا')"><img src="/img/brand/logo-lockup-light.png" alt="Veloura" width="1042" height="217" decoding="async" /></a></div>
    <nav class="vs-header__nav" [attr.aria-label]="text('Primary navigation','التنقل الرئيسي')">
      @for (link of links; track link.path) {
        <a [routerLink]="t.path(link.path)" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: link.exact }">{{ text(link.en,link.ar) }}</a>
      }
    </nav>
    <div class="vs-header__actions">
      <button type="button" class="vs-header__language" (click)="changeLanguage()" [attr.aria-label]="text('Switch to Arabic','Switch to English')">{{ t.isArabic()?'EN':'عربي' }}</button>
      <a class="vs-header__cta" [routerLink]="t.path('/contact')">{{ text('Start a project','ابدأ مشروعك') }} <span aria-hidden="true">↗</span></a>
      <button type="button" class="vs-header__menu" [attr.aria-expanded]="menuOpen()" aria-controls="vs-mobile-navigation" (click)="toggleMenu()" [attr.aria-label]="menuOpen()?text('Close navigation','إغلاق القائمة'):text('Open navigation','فتح القائمة')">
        <span></span><span></span>
      </button>
    </div>
  </div>
  @if (menuOpen()) {
    <nav id="vs-mobile-navigation" class="vs-header__drawer" [attr.aria-label]="text('Mobile navigation','قائمة الهاتف')">
      @for (link of links; track link.path;let i = $index) {
        <a [routerLink]="t.path(link.path)" (click)="menuOpen.set(false)"><span>0{{ i+1 }}</span>{{ text(link.en,link.ar) }}<span aria-hidden="true">↗</span></a>
      }
      <button type="button" (click)="changeLanguage()">{{ text('العربية','English') }} <span aria-hidden="true">↗</span></button>
    </nav>
  }
</header>
